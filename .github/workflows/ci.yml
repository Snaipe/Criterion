name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  setup-ubuntu: &setup-ubuntu |
    sudo apt-get update
    sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes \
      build-essential pkgconf meson cmake git python3-pip python3-venv \
      libgit2-dev libffi-dev libnanomsg-dev
  setup-debian: &setup-debian |
    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install --yes \
      build-essential pkgconf meson cmake git python3-pip python3-venv \
      libgit2-dev libffi-dev libnanomsg-dev
  setup-alpine: &setup-alpine |
    apk add --update-cache --upgrade --no-cache \
      build-base pkgconf meson cmake git py3-pip \
      libgit2-dev libffi-dev # nanomsg-dev is currently broken
  setup-alpine-armv7: &setup-alpine-armv7
    apk add --update-cache --upgrade --no-cache build-base pkgconf meson cmake git py3-pip libgit2-dev libffi-dev
  setup-fedora: &setup-fedora |
    dnf install --assumeyes \
      @development-tools pkgconf meson cmake git python3-pip python3-virtualenv \
      libgit2-devel libffi-devel # nanomsg-devel is currently broken
  setup-macos: &setup-macos |
    brew update
    brew install pkgconf meson cmake git libgit2 libffi nanomsg
  setup-windows: &setup-windows |
    choco install --yes --no-progress ninja cmake python

jobs:
  build-and-test:
    name: "CI @ Ubuntu (x86-64)"
    runs-on: ubuntu-latest

    env:
      python_test_venv_activate: .venv/bin/activate

    steps:
      - name: "Platform setup"
        run: ${{ env.setup-ubuntu }}

      - name: Checkout Criterion
        uses: actions/checkout@v5

      - name: "Setup Python test venv"
        run: |
          python3 -m venv .venv

          . $python_test_venv_activate
          pip install cram==0.7

      - name: "Setup"
        run: |
          . $python_test_venv_activate
          meson setup build

      - name: "Build"
        run: |
          . $python_test_venv_activate
          meson compile -C build

      - name: "Test"
        run: |
          . $python_test_venv_activate
          meson test -C build

  build-with-fil-c:
    name: "Build with Fil-C (x86-64)"
    runs-on: ubuntu-latest

    env:
      python_test_venv_activate: .venv/bin/activate

    steps:
      - name: "Platform setup"
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            pkgconf meson cmake git python3-pip python3-venv \
            libgit2-dev libffi-dev \
            curl jq xz-utils

      - name: Checkout Criterion
        uses: actions/checkout@v5

      - name: Install Fil-C
        run: |
          release_json="$(curl --fail --silent --show-error \
            https://api.github.com/repos/pizlonator/fil-c/releases/latest)"
          asset_url="$(printf '%s' "$release_json" | jq -r '
            .assets[]
            | select(.name | test("^optfil-.*-linux-x86_64\\.tar\\.xz$"))
            | .browser_download_url
          ' | head -n1)"

          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "Unable to find a Linux x86_64 /opt/fil asset in the latest release." >&2
            exit 1
          fi

          mkdir -p .filc
          curl --fail --location --silent --show-error "$asset_url" --output .filc/optfil.tar.xz
          tar -xJf .filc/optfil.tar.xz -C .filc --strip-components=1
          (
            cd .filc
            printf 'YES\n' | sudo ./setup.sh
          )

      - name: "Setup Python test venv"
        run: |
          python3 -m venv .venv
          . $python_test_venv_activate
          pip install cram==0.7

      - name: "Build Fil-C SDK"
        run: |
          . $python_test_venv_activate
          rm -rf /tmp/criterion-filc-prefix
          export CRITERION_FILC_SHARED_LIBRARY=true
          ./ci/install-fil-criterion-from-source.sh "$PWD" /tmp/criterion-filc-prefix

      - name: "Smoke test installed Fil-C SDK"
        run: |
          . $python_test_venv_activate
          export PKG_CONFIG_PATH=/tmp/criterion-filc-prefix/lib/pkgconfig
          export LD_LIBRARY_PATH=/tmp/criterion-filc-prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}

          cat > /tmp/smoke-criterion.c <<'EOF'
          #include <criterion/criterion.h>

          Test(smoke, passes) {
              cr_assert(2 + 2 == 4);
          }
          EOF

          # Dynamic link against libcriterion.so (requires LD_LIBRARY_PATH).
          /opt/fil/bin/filcc \
            /tmp/smoke-criterion.c \
            -o /tmp/smoke-criterion-dynamic \
            $(pkg-config --cflags --libs criterion)

          /tmp/smoke-criterion-dynamic

          # Static link against libcriterion.a (does not require LD_LIBRARY_PATH).
          /opt/fil/bin/filcc \
            /tmp/smoke-criterion.c \
            -o /tmp/smoke-criterion-static \
            $(pkg-config --cflags --libs --static criterion)

          /tmp/smoke-criterion-static

      - name: "Create Fil-C SDK artifact"
        run: |
          rm -rf artifacts/criterion-fil-sdk
          mkdir -p artifacts/criterion-fil-sdk/opt
          cp -R /tmp/criterion-filc-prefix artifacts/criterion-fil-sdk/opt/criterion-fil

          cat > artifacts/criterion-fil-sdk/README.txt <<'EOF'
          Criterion Fil-C SDK

          Supported target:
          - Linux x86-64 with /opt/fil

          Artifact layout:
          - opt/criterion-fil/include
          - opt/criterion-fil/lib
          - opt/criterion-fil/lib/pkgconfig/criterion.pc

          Then build your downstream tests with:

            export CRITERION_PREFIX="$PWD/opt/criterion-fil"
            export PKG_CONFIG_PATH="$CRITERION_PREFIX/lib/pkgconfig"

            /opt/fil/bin/filcc your-tests.c -o your-tests \
              $(pkg-config --cflags --libs criterion)

          Important:
          - consumers must use /opt/fil on Linux x86-64
          - the pkg-config metadata already enables CRITERION_FILC_SIMPLE
          EOF

      - name: Upload Fil-C artifact
        uses: actions/upload-artifact@v4
        with:
          name: criterion-fil-sdk-linux-x86_64
          path: artifacts/criterion-fil-sdk
          if-no-files-found: error

  binaries:
    name: "Binaries"
    uses: ./.github/workflows/binaries.yml
