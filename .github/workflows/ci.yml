name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  setup-ubuntu: &setup-ubuntu |
    sudo apt-get update
    sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes \
      build-essential pkgconf meson cmake git python3-pip python3-venv \
      libgit2-dev libffi-dev libnanomsg-dev
  setup-debian: &setup-debian |
    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install --yes \
      build-essential pkgconf meson cmake git python3-pip python3-venv \
      libgit2-dev libffi-dev libnanomsg-dev
  setup-alpine: &setup-alpine |
    apk add --update-cache --upgrade --no-cache \
      build-base pkgconf meson cmake git py3-pip \
      libgit2-dev libffi-dev # nanomsg-dev is currently broken
  setup-alpine-armv7: &setup-alpine-armv7
    apk add --update-cache --upgrade --no-cache build-base pkgconf meson cmake git py3-pip libgit2-dev libffi-dev
  setup-fedora: &setup-fedora |
    dnf install --assumeyes \
      @development-tools pkgconf meson cmake git python3-pip python3-virtualenv \
      libgit2-devel libffi-devel # nanomsg-devel is currently broken
  setup-macos: &setup-macos |
    brew update
    brew install pkgconf meson cmake git libgit2 libffi nanomsg
  setup-windows: &setup-windows |
    choco install --yes --no-progress ninja cmake python

jobs:
  build-and-test:
    name: "CI @ ${{ matrix.platform.name }}"

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Ubuntu (x86-64)
            os: ubuntu-latest
            setup: *setup-ubuntu

          - name: Ubuntu (AArch64)
            os: ubuntu-24.04-arm
            setup: *setup-ubuntu

          # - name: macOS (x86-64)
          #   os: macos-15-intel
          #   setup: *setup-macos

          - name: macOS (AArch64)
            os: macos-latest
            setup: *setup-macos

          # - name: Windows (x86-64)
          #   os: windows-latest
          #   setup: *setup-windows

          - name: Debian (x86-64)
            container: debian:latest
            setup: *setup-debian

          - name: Fedora (x86-64)
            container: fedora:latest
            setup: *setup-fedora

          - name: Alpine (x86-64)
            container: alpine:latest
            setup: *setup-alpine
            shell: sh

          - name: Alpine (AArch64)
            container: alpine:latest
            runs-on: ubuntu-24.04-arm
            setup: *setup-alpine
            shell: sh
            checkout-workaround: true

          - name: Alpine (ARMv7)
            container: arm32v7/alpine:latest
            runs-on: ubuntu-24.04-arm
            setup: *setup-alpine-armv7
            shell: sh
            checkout-workaround: true

    runs-on: ${{ matrix.platform.os || matrix.platform.runs-on || 'ubuntu-latest' }}
    container: ${{ matrix.platform.container || '' }}

    defaults:
      run:
        shell: ${{ matrix.platform.shell || 'bash' }}

    env:
      python_test_venv_activate: .venv/bin/activate

    steps:
      - name: "Platform setup"
        run: ${{ matrix.platform.setup }}

      - name: Checkout Criterion
        if: ${{ !matrix.platform.checkout-workaround }}
        uses: actions/checkout@v5

      - name: Checkout Criterion (workaround)
        if: ${{ matrix.platform.checkout-workaround }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git init
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.ref }}"
          git checkout FETCH_HEAD

      - name: "Setup Python test venv"
        run: |
          python3 -m venv .venv

          if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
            python_test_venv_activate=".venv/Scripts/activate"
            echo "python_test_venv_activate=$python_test_venv_activate" >> $GITHUB_ENV
          fi

          . $python_test_venv_activate
          pip install cram==0.7

          if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
            pip install meson
            git config --global core.autocrlf false
            patch --forward --directory=".venv\\Lib\\site-packages\\cram" < ci/cram-fix-winenv.patch
            patch --forward --directory=".venv\\Lib\\site-packages\\cram" < ci/cram-ignore-cr.patch
          fi

      - name: "Setup"
        run: |
          . $python_test_venv_activate
          meson setup build

      - name: "Build"
        run: |
          . $python_test_venv_activate
          meson compile -C build

      - name: "Test"
        run: |
          . $python_test_venv_activate
          meson test -C build

  build-with-fil-c:
    name: "Build with Fil-C (x86-64)"
    runs-on: ubuntu-latest

    env:
      python_test_venv_activate: .venv/bin/activate

    steps:
      - name: "Platform setup"
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            pkgconf meson cmake git python3-pip python3-venv \
            libgit2-dev libffi-dev \
            curl jq xz-utils

      - name: Checkout Criterion
        uses: actions/checkout@v5

      - name: Install Fil-C
        run: |
          release_json="$(curl --fail --silent --show-error \
            https://api.github.com/repos/pizlonator/fil-c/releases/latest)"
          asset_url="$(printf '%s' "$release_json" | jq -r '
            .assets[]
            | select(.name | test("^optfil-.*-linux-x86_64\\.tar\\.xz$"))
            | .browser_download_url
          ' | head -n1)"

          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "Unable to find a Linux x86_64 /opt/fil asset in the latest release." >&2
            exit 1
          fi

          mkdir -p .filc
          curl --fail --location --silent --show-error "$asset_url" --output .filc/optfil.tar.xz
          tar -xJf .filc/optfil.tar.xz -C .filc --strip-components=1
          (
            cd .filc
            printf 'YES\n' | sudo ./setup.sh
          )

      - name: "Setup Python test venv"
        run: |
          python3 -m venv .venv
          . $python_test_venv_activate
          pip install cram==0.7

      - name: "Setup"
        env:
          CC: /opt/fil/bin/filcc
          CXX: /opt/fil/bin/fil++
        run: |
          . $python_test_venv_activate
          meson setup build \
            --force-fallback-for=nanomsg,libgit2 \
            -Dtheories=disabled \
            -Dshared-library=false \
            -Dtests=false \
            -Dsamples=false \
            --prefix=/opt/criterion-fil

      - name: "Build"
        env:
          CC: /opt/fil/bin/filcc
          CXX: /opt/fil/bin/fil++
        run: |
          . $python_test_venv_activate
          meson compile -C build criterion

      - name: "Install"
        run: |
          rm -rf artifacts/criterion-fil
          mkdir -p artifacts/criterion-fil/opt/criterion-fil/include
          mkdir -p artifacts/criterion-fil/opt/criterion-fil/lib/pkgconfig

          boxfort_lib="$(find build -type f \( -name 'libboxfort*.a' -o -name '*boxfort*.a' \) | head -n1)"
          libgit2_lib="$(find build -type f \( -name 'libgit2*.a' -o -name 'git2.a' \) | head -n1)"
          nanomsg_lib="$(find build -type f -name 'libnanomsg*.a' | head -n1)"
          nanopb_lib="$(find build -type f \( -name 'libprotobuf-nanopb-static.a' -o -name 'libprotobuf*.a' -o -name 'libnanopb*.a' \) | head -n1)"

          cp -R include/criterion artifacts/criterion-fil/opt/criterion-fil/include/
          cp build/src/libcriterion.a artifacts/criterion-fil/opt/criterion-fil/lib/
          
          private_libs="-lm -lrt -lpthread"
          if [ -n "$boxfort_lib" ]; then
            cp "$boxfort_lib" artifacts/criterion-fil/opt/criterion-fil/lib/
            private_libs="-lboxfort $private_libs"
          fi
          if [ -n "$libgit2_lib" ]; then
            cp "$libgit2_lib" artifacts/criterion-fil/opt/criterion-fil/lib/
            private_libs="-lgit2 $private_libs"
          fi
          if [ -n "$nanomsg_lib" ]; then
            cp "$nanomsg_lib" artifacts/criterion-fil/opt/criterion-fil/lib/
            private_libs="-lnanomsg $private_libs"
          fi
          if [ -n "$nanopb_lib" ]; then
            cp "$nanopb_lib" artifacts/criterion-fil/opt/criterion-fil/lib/
            nanopb_name="$(basename "$nanopb_lib")"
            nanopb_name="${nanopb_name#lib}"
            nanopb_name="${nanopb_name%.a}"
            private_libs="-l${nanopb_name} $private_libs"
          fi

          cat > artifacts/criterion-fil/opt/criterion-fil/lib/pkgconfig/criterion.pc <<EOF
          prefix=/opt/criterion-fil
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: criterion
          Description: Criterion unit testing framework for C/C++
          Version: 2.4.3-fil
          Cflags: -I\${includedir}
          Libs: -L\${libdir} -lcriterion
          Libs.private: ${private_libs}
          EOF

      - name: Upload Fil-C artifact
        uses: actions/upload-artifact@v4
        with:
          name: criterion-fil-linux-x86_64
          path: artifacts/criterion-fil/opt/criterion-fil
          if-no-files-found: error

  binaries:
    name: "Binaries"
    uses: ./.github/workflows/binaries.yml
