name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  setup-ubuntu: &setup-ubuntu |
    sudo apt-get update
    sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes \
      build-essential pkgconf meson cmake git python3-pip python3-venv \
      libgit2-dev libffi-dev libnanomsg-dev
  setup-debian: &setup-debian |
    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install --yes \
      build-essential pkgconf meson cmake git python3-pip python3-venv \
      libgit2-dev libffi-dev libnanomsg-dev
  setup-alpine: &setup-alpine |
    apk add --update-cache --upgrade --no-cache \
      build-base pkgconf meson cmake git py3-pip \
      libgit2-dev libffi-dev # nanomsg-dev is currently broken
  setup-alpine-armv7: &setup-alpine-armv7
    apk add --update-cache --upgrade --no-cache build-base pkgconf meson cmake git py3-pip libgit2-dev libffi-dev
  setup-fedora: &setup-fedora |
    dnf install --assumeyes \
      @development-tools pkgconf meson cmake git python3-pip python3-virtualenv \
      libgit2-devel libffi-devel # nanomsg-devel is currently broken
  setup-macos: &setup-macos |
    brew update
    brew install pkgconf meson cmake git libgit2 libffi nanomsg
  setup-windows: &setup-windows |
    choco install --yes --no-progress ninja cmake python

jobs:
  build-and-test:
    name: "CI @ Ubuntu (x86-64)"
    runs-on: ubuntu-latest

    env:
      python_test_venv_activate: .venv/bin/activate

    steps:
      - name: "Platform setup"
        run: ${{ env.setup-ubuntu }}

      - name: Checkout Criterion
        uses: actions/checkout@v5

      - name: "Setup Python test venv"
        run: |
          python3 -m venv .venv

          . $python_test_venv_activate
          pip install cram==0.7

      - name: "Setup"
        run: |
          . $python_test_venv_activate
          meson setup build

      - name: "Build"
        run: |
          . $python_test_venv_activate
          meson compile -C build

      - name: "Test"
        run: |
          . $python_test_venv_activate
          meson test -C build

  build-with-fil-c:
    name: "Build with Fil-C (x86-64)"
    runs-on: ubuntu-latest

    env:
      python_test_venv_activate: .venv/bin/activate

    steps:
      - name: "Platform setup"
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            pkgconf meson cmake git python3-pip python3-venv \
            libgit2-dev libffi-dev \
            curl jq xz-utils

      - name: Checkout Criterion
        uses: actions/checkout@v5

      - name: Install Fil-C
        run: |
          release_json="$(curl --fail --silent --show-error \
            https://api.github.com/repos/pizlonator/fil-c/releases/latest)"
          asset_url="$(printf '%s' "$release_json" | jq -r '
            .assets[]
            | select(.name | test("^optfil-.*-linux-x86_64\\.tar\\.xz$"))
            | .browser_download_url
          ' | head -n1)"

          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "Unable to find a Linux x86_64 /opt/fil asset in the latest release." >&2
            exit 1
          fi

          mkdir -p .filc
          curl --fail --location --silent --show-error "$asset_url" --output .filc/optfil.tar.xz
          tar -xJf .filc/optfil.tar.xz -C .filc --strip-components=1
          (
            cd .filc
            printf 'YES\n' | sudo ./setup.sh
          )

      - name: "Setup Python test venv"
        run: |
          python3 -m venv .venv
          . $python_test_venv_activate
          pip install cram==0.7

      - name: "Setup"
        env:
          CC: /opt/fil/bin/filcc
          CXX: /opt/fil/bin/fil++
        run: |
          . $python_test_venv_activate
          meson setup build \
            --force-fallback-for=nanomsg,libgit2 \
            -Dtheories=disabled \
            -Ddiffs=disabled \
            -Dfilc-simple=true \
            -Dshared-library=false \
            -Dtests=false \
            -Dsamples=false \
            --prefix=/opt/criterion-fil

      - name: "Build"
        env:
          CC: /opt/fil/bin/filcc
          CXX: /opt/fil/bin/fil++
        run: |
          . $python_test_venv_activate
          meson compile -C build criterion

      - name: "Smoke test subproject consumer"
        env:
          CC: /opt/fil/bin/filcc
          CXX: /opt/fil/bin/fil++
        run: |
          rm -rf /tmp/criterion-filc-consumer
          mkdir -p /tmp/criterion-filc-consumer/subprojects/criterion

          cp ci/filc-consumer/meson.build /tmp/criterion-filc-consumer/
          cp ci/filc-consumer/sample_tests.c /tmp/criterion-filc-consumer/

          git archive --format=tar HEAD \
            | tar -C /tmp/criterion-filc-consumer/subprojects/criterion -xf -

          . $python_test_venv_activate
          CC="$CC" CXX="$CXX" meson setup /tmp/criterion-filc-consumer/build /tmp/criterion-filc-consumer
          CC="$CC" CXX="$CXX" meson test -C /tmp/criterion-filc-consumer/build --print-errorlogs

      - name: "Create Fil-C source bundle"
        run: |
          rm -rf artifacts/criterion-fil-source
          mkdir -p artifacts/criterion-fil-source

          git archive --format=tar.gz \
            --output=artifacts/criterion-fil-source/criterion-fil-source.tar.gz \
            HEAD

          cat > artifacts/criterion-fil-source/README.txt <<'EOF'
          Criterion Fil-C source bundle

          This bundle is intended to be built from source with Fil-C in the consuming
          project's CI job or build environment. It is not a standalone prebuilt SDK.

          Supported target:
          - Linux x86-64 with /opt/fil

          End-to-end example:
          - see ci/filc-consumer for a minimal Meson consumer project that builds
            Criterion as a subproject with Fil-C

          Preferred installation path:

            ./ci/install-fil-criterion-from-source.sh <criterion-source-dir> <install-prefix>

          Example:

            ./ci/install-fil-criterion-from-source.sh "$PWD" "$PWD/out"

          Equivalent manual configure/build commands:

            CC=/opt/fil/bin/filcc \
            CXX=/opt/fil/bin/fil++ \
            meson setup build \
              --force-fallback-for=nanomsg,libgit2 \
              -Dtheories=disabled \
              -Ddiffs=disabled \
              -Dfilc-simple=true \
              -Dshared-library=false \
              -Dtests=false \
              -Dsamples=false

            meson compile -C build criterion

          The helper script installs:
          - headers into <install-prefix>/include
          - libcriterion.a into <install-prefix>/lib
          - criterion.pc into <install-prefix>/lib/pkgconfig

          Then build your downstream tests with:

            export PKG_CONFIG_PATH="<install-prefix>/lib/pkgconfig"
            /opt/fil/bin/filcc your-tests.c \
              $(pkg-config --cflags --libs --static criterion)
          EOF

      - name: Upload Fil-C artifact
        uses: actions/upload-artifact@v4
        with:
          name: criterion-fil-source-linux-x86_64
          path: artifacts/criterion-fil-source
          if-no-files-found: error

  binaries:
    name: "Binaries"
    uses: ./.github/workflows/binaries.yml
